trading:
  mode: "paper"
  pairs:
    majors:
      - EUR/USD
      - GBP/USD
      - USD/JPY
      - USD/CHF
      - AUD/USD
      - USD/CAD
      - NZD/USD
    minors:
      - EUR/JPY
      - EUR/CHF
      - EUR/AUD
      - EUR/CAD
      - EUR/NZD
      - GBP/JPY
      - GBP/CHF
      - GBP/AUD
      - GBP/CAD
      - GBP/NZD
      - AUD/JPY
      - AUD/CAD
      - AUD/CHF
      - AUD/NZD
      - NZD/JPY
      - NZD/CAD
      - NZD/CHF
      - CAD/JPY
      - CAD/CHF
      - CHF/JPY
    shadow: []
  lot_size: 3

timeframes:
  regime: "1h"
  momentum: "30m"
  entry: "15m"

strategy:
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  sma_period: 50
  sma_alignment_enabled: true
  rsi_ma_gate_enabled: true
  rsi_ma_gate_period: 5
  lookback_bars: 20
  cooldown_minutes: 60
  session_filter_enabled: true
  session_allowed_utc:
    - "06-17"
    - "12-21"
  breakout_buffer_pips: 0.0
  # Confirmation profiles. Per-pair overrides retired 2026-06 (Branch B: numbers came from divergent engine).
  # All pairs now use global default (V2 reversal with b0.5 c2). See CLAUDE.md research note.
  confirmation_profiles:
    default:
      variant: "V2"
      buffer_pips: 0.5
      confirm_bars: 2
    pairs: {}  # no per-pair overrides (reverted to default for consistency with honest R1)
  spread_filter_enabled: true
  max_spread_pips: 2.0
  spread_limits_pips:
    GBP/CHF: 2.5
    AUD/CAD: 2.5
    USD/JPY: 2.0
    GBP/JPY: 3.0
    NZD/JPY: 3.0
  pair_priorities:
    GBP/CHF: 100
    NZD/JPY: 90
    GBP/JPY: 85
    AUD/CAD: 80
    USD/JPY: 75
  pair_overrides: {}  # reverted to global defaults (sma_period=50, tp_atr=1.0, sl_atr=3.0) 2026-06 Branch B consolidation; old values from divergent-engine backtests

  # EMA analysis — disabled by default, runs alongside RSI when on
  ema:
    enabled: true
    standalone_notifications_enabled: false
    fast_period: 9
    slow_period: 21
    medium_period: 50
    long_period: 200
    crossover_enabled: true
    price_touch_enabled: true
    slope_enabled: false
    touch_threshold_pips: 1.0
    max_signals_per_pair: 3
    # EMA trend-alignment confidence modifier (scales RSI signal confidence,
    # not a gate). Default off — no effect on existing signals until enabled.
    confidence_modifier_enabled: false
    confidence_ref_period: 200
    confidence_boost: 1.10
    confidence_dampen: 0.85

risk:
  # TP/SL: fixed-dollar values per AGENTS.md (~$500 TP, ~$1800 SL)
  # ATR-based multipliers kept for reference (tp_atr_multiplier: 1.0, sl_atr_multiplier: 3.0)
  tp_atr_multiplier: 1.0
  sl_atr_multiplier: 3.0
  tp_usd_legacy: 500
  sl_usd_legacy: 1800
  max_daily_loss_usd: 1500
  max_concurrent_positions: 1

news:
  enabled: true
  lockout_minutes_before: 60
  lockout_minutes_after: 30
  importance_threshold: 3

data:
  provider: "yfinance"
  warmup_candles: 200
  oanda:
    api_key: "${OANDA_API_KEY}"
    account_id: "${OANDA_ACCOUNT_ID}"
    practice: true

telegram:
  enabled: true
  signal_notifications: true
  near_setup_notifications: false
  aligned_pending_notifications: false
  setup_digest_notifications: true
  setup_digest_interval_minutes: 60
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"
