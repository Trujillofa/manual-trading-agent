trading:
  mode: "paper"
  pairs:
    majors:
      - GBP/USD
      - NZD/USD
      - AUD/JPY
    minors: []
    exotics: []
  lot_size: 3

timeframes:
  regime: "1h"
  momentum: "30m"
  entry: "15m"

strategy:
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  lookback_bars: 20
  cooldown_minutes: 60
  session_filter_enabled: true
  session_allowed_utc:
    - "06-17"
    - "12-21"
  breakout_buffer_pips: 0.0
  spread_filter_enabled: true
  max_spread_pips: 2.0
  spread_limits_pips:
    GBP/USD: 1.8
    NZD/USD: 2.0
    AUD/JPY: 1.5
  pair_priorities:
    EUR/GBP: 100
    USD/JPY: 80
    GBP/USD: 60
    GBP/CHF: 60
    EUR/USD: 40

risk:
  tp_usd: 300
  sl_usd: 900
  max_daily_loss_usd: 1500
  max_concurrent_positions: 1

news:
  enabled: true
  lockout_minutes_before: 60
  lockout_minutes_after: 30
  importance_threshold: 3

data:
  provider: "yfinance"
  warmup_candles: 200
  oanda:
    api_key: "${OANDA_API_KEY}"
    account_id: "${OANDA_ACCOUNT_ID}"
    practice: true

telegram:
  enabled: true
  signal_notifications: true
  near_setup_notifications: false
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"
