trading:
  mode: "paper"
  pairs:
    majors: []
    minors:
      - AUD/CAD
    shadow:
      - GBP/CHF
  lot_size: 3

timeframes:
  regime: "1h"
  momentum: "30m"
  entry: "15m"

strategy:
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  sma_period: 50
  sma_alignment_enabled: true
  lookback_bars: 20
  cooldown_minutes: 60
  session_filter_enabled: true
  session_allowed_utc:
    - "06-17"
    - "12-21"
  breakout_buffer_pips: 0.0
  spread_filter_enabled: true
  max_spread_pips: 2.0
  spread_limits_pips:
    GBP/CHF: 2.5
    AUD/CAD: 2.5
  pair_priorities:
    AUD/CAD: 100
    GBP/CHF: 60

risk:
  # TP/SL: fixed-dollar values per AGENTS.md (~$500 TP, ~$1800 SL)
  # ATR-based multipliers kept for reference (tp_atr_multiplier: 1.0, sl_atr_multiplier: 3.0)
  tp_atr_multiplier: 1.0
  sl_atr_multiplier: 3.0
  tp_usd_legacy: 500
  sl_usd_legacy: 1800
  max_daily_loss_usd: 1500
  max_concurrent_positions: 1

news:
  enabled: true
  lockout_minutes_before: 60
  lockout_minutes_after: 30
  importance_threshold: 3

data:
  provider: "yfinance"
  warmup_candles: 200
  oanda:
    api_key: "${OANDA_API_KEY}"
    account_id: "${OANDA_ACCOUNT_ID}"
    practice: true

telegram:
  enabled: true
  signal_notifications: true
  near_setup_notifications: false
  aligned_pending_notifications: true
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"
