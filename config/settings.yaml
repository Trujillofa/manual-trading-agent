# Branch B production config.
#
# POSTURE: ops / decision-support only — NOT a KEEP / profitability claim.
# RSI MTF, EMA standalone, and ETR alerts are discretionary human aids.
# Do not auto-size or auto-execute from these signals.
#
trading:
  mode: "paper"
  pairs:
    # Multi-asset Branch B watchlist (scanner + Telegram only; not a KEEP claim).
    # Continuous futures (GC=F / CL=F / NQ=F) roll — levels are approximate.
    majors:
      - XAU/USD
      - BTC/USD
      - OIL
      - NASDAQ
    minors: []
    shadow: []
  lot_size: 3

timeframes:
  regime: "1h"
  momentum: "30m"
  entry: "15m"

strategy:
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  sma_period: 50
  sma_alignment_enabled: true
  rsi_ma_gate_enabled: true
  rsi_ma_gate_period: 5
  lookback_bars: 20
  cooldown_minutes: 60
  session_filter_enabled: true
  # Global fallback; per-instrument session_allowed_utc in instruments: overrides via evaluate_entry overrides.
  session_allowed_utc:
    - "00-24"
  breakout_buffer_pips: 0.5  # FX/legacy only; multi-asset uses ATR fraction below
  breakout_buffer_atr_frac: 0.05  # buffer = ATR(14,15m) * frac (scale-free across assets)
  # Confirmation profiles. Multi-asset uses ATR-scaled buffer via cli overrides.
  confirmation_profiles:
    default:
      variant: "V2"
      buffer_pips: 0.5
      confirm_bars: 2
    pairs: {}
  # No reliable free bid/ask for GC/CL/NQ/BTC on this stack.
  spread_filter_enabled: false
  max_spread_pips: 50.0
  spread_limits_pips: {}
  pair_priorities:
    XAU/USD: 100
    BTC/USD: 90
    OIL: 80
    NASDAQ: 85
  pair_overrides: {}

  # EMA: 20/50 golden/death cross for intraday multi-asset alerts (Branch B).
  # medium_period stays 100 (not 50) so it does not duplicate slow.
  ema:
    enabled: true
    standalone_notifications_enabled: true
    standalone_signal_types:
      - crossover
    standalone_timeframes:
      - "30m"
    standalone_session_filter_enabled: true
    fast_period: 20
    slow_period: 50
    medium_period: 100
    long_period: 200
    crossover_enabled: true
    price_touch_enabled: true
    slope_enabled: false
    touch_threshold_pips: 1.0
    max_signals_per_pair: 3
    confidence_modifier_enabled: false
    confidence_ref_period: 200
    confidence_boost: 1.10
    confidence_dampen: 0.85

# Instrument metadata (yf tickers, point size for display, news currencies, sessions).
# Session windows: _session_allowed cannot wrap midnight — use two windows for CME gaps.
instruments:
  XAU/USD:
    yf_symbol: GC=F
    point_size: 0.1
    currencies: [XAU, USD]
    session_allowed_utc: ["00-21", "22-24"]
  BTC/USD:
    yf_symbol: BTC-USD
    point_size: 1.0
    currencies: [USD]
    session_allowed_utc: ["00-24"]
  OIL:
    yf_symbol: CL=F
    point_size: 0.01
    currencies: []
    session_allowed_utc: ["00-21", "22-24"]
  NASDAQ:
    yf_symbol: NQ=F
    point_size: 0.25
    currencies: [USD]
    session_allowed_utc: ["00-21", "22-24"]

risk:
  tp_atr_multiplier: 1.0
  sl_atr_multiplier: 3.0
  tp_usd_legacy: 500
  sl_usd_legacy: 1800
  max_daily_loss_usd: 1500
  max_concurrent_positions: 1

news:
  enabled: true
  lockout_minutes_before: 60
  lockout_minutes_after: 30
  importance_threshold: 3

data:
  provider: "yfinance"
  warmup_candles: 200
  oanda:
    api_key: "${OANDA_API_KEY}"
    account_id: "${OANDA_ACCOUNT_ID}"
    practice: true

telegram:
  enabled: true
  signal_notifications: true
  near_setup_notifications: false
  aligned_pending_notifications: false
  setup_digest_notifications: false
  setup_digest_interval_minutes: 60
  pre_ny_briefing_notifications: true
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"

# ETR Edge Market Terminal (https://etracademy.com/analisis/*)
# Change-only Telegram alerts. Credentials: ETRACADEMY_LOGIN / ETRACADEMY_PASSWORD.
etr:
  enabled: true
  assets: [btc, gold, nasdaq, oil]
  poll_with_scan: true
  min_poll_interval_seconds: 900
  score_alert_low: 50
  score_alert_high: 80
  score_delta_alert: 10
  error_alert_cooldown_minutes: 360
  telegram_alerts: true
  # Telegram only for thesis changes. Score/estado/zone ticks stay in etr_audit.
  telegram_alert_fields:
    - bias
    - primary_direction
    - price_in_primary_zone
  # Forward paper-shadow: resolve open zone events after this many hours
  shadow_horizon_hours: 24
  login: "${ETRACADEMY_LOGIN}"
  password: "${ETRACADEMY_PASSWORD}"

# Once-per-day pre-NY three-pillar briefing (Gold / BTC / Nasdaq / Oil).
# NY open = 12:00 UTC to match this repo's historical FX NY window (12–21 UTC).
# That is ~08:00 America/New_York in EDT and ~07:00 in EST. No DST flip.
# Not CME Globex reopen and not US cash equity open (13:30/14:30 UTC).
# Decision-support only — not a trade-entry signal and not live-go authorization.
briefing:
  enabled: true
  ny_open_utc: "12:00"
  lead_minutes: 60
  skip_weekends: true
  news_hours_ahead: 36
  news_hours_behind: 8
  max_events_per_instrument: 3
  telegram_notifications: true
  instruments:
    - id: XAU/USD
      etr_asset: gold
      extra_news_currencies: [USD]
      news_keywords: [gold, xau]
    - id: BTC/USD
      etr_asset: btc
      extra_news_currencies: [USD]
      news_keywords: [bitcoin, crypto]
    - id: NASDAQ
      etr_asset: nasdaq
      extra_news_currencies: [USD]
      news_keywords: [nasdaq]
    - id: OIL
      etr_asset: oil
      extra_news_currencies: [USD]
      news_keywords: [oil, crude, eia, wti, opec, inventory]
  # Existing Hermes Agent on Hetzner (emilio user): `hermes chat -q` → glm-5.2 / Z.AI.
  # Scheduled invoke is host cron as emilio (scripts/run_pre_ny_briefing_host.sh),
  # not the scan container (no hermes binary; hermes serve is not up).
  # Set endpoint only if you expose an OpenAI-compat proxy. Do not use --safe-mode.
  # If Hermes is down, briefing still sends: "Plan NY: no disponible".
  hermes:
    enabled: true
    endpoint: ""
    cli_command: hermes
    timeout_seconds: 120
    model: ""
