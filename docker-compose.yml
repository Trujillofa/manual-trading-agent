services:
  manual-trading-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: manual-trading-agent
    restart: unless-stopped
    env_file:
      - .env
    # Environment variables expected in .env:
    #   OANDA_API_KEY=...
    #   OANDA_ACCOUNT_ID=...
    #   OANDA_ENVIRONMENT=practice  # or live
    #   TELEGRAM_BOT_TOKEN=...
    #   TELEGRAM_CHAT_ID=...
    environment:
      - TZ=America/Bogota
      - TELEGRAM_POLL_ENABLED=${TELEGRAM_POLL_ENABLED:-true}
      - LOG_DIR=${LOG_DIR:-/app/logs}
      - ROTATE_THRESHOLD_BYTES=${ROTATE_THRESHOLD_BYTES:-52428800}
      - RETAIN_BYTES=${RETAIN_BYTES:-26214400}
      - SCAN_INTERVAL_SECONDS=${SCAN_INTERVAL_SECONDS:-900}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config:ro
      - ./results:/app/results
    ports:
      - "127.0.0.1:9090:9090"  # Prometheus metrics (optional, for future use)
    # Run scan every 15 minutes + poll Telegram commands continuously.
    # Log rotation for scan.log and signal_audit.jsonl is handled by run_scanner_loop.sh.
    # Local dev with prod token: use docker-compose.local.yml (see that file).
    entrypoint: ["/app/scripts/run_scanner_loop.sh"]
    healthcheck:
      test: ["CMD", "python", "-m", "src.cli", "healthcheck"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 1m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  # ---------------------------------------------------------------------------
